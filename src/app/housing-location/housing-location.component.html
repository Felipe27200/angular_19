<section class="listing">
    <img
      class="listing-photo"
      [src]="housingLocation.photo"
      alt="Exterior photo of {{ housingLocation.name }}"
      crossorigin
    />
    <!-- 
        That is the interpolation to print the 
        data from the component TS to the HTML
    -->
    <h2 class="listing-heading">{{ housingLocation.name }}</h2>
    <p class="listing-location">{{ housingLocation.city }}, {{ housingLocation.state }}</p>

    <!-- 
      The routerLink directive lets angular create dynamics links.

      The value assigned to this directive is an arrays that contains the path
      and the dynamic data, respectively.
    -->
    <a [routerLink]="['/details', housingLocation.id]">Learn More</a>
  </section>
