<section>
    <form>
      <!-- 
        #filter is a template reference variable that refers
        to the input element (can also referes to a component).

        This lets us to access to the input element as its value.
      -->
      <input type="text" placeholder="Filter by city" #filter/>

      <!-- 
        In the eventhandler, we pass the value of the input
        through the template reference variable #filter using
        the value property to access the input value.
      -->
      <button 
        class="primary" 
        type="button"
        (click)="filterResults(filter.value)"
      >Search</button>
    </form>
  </section>
  <section class="results">
    <!-- 
        This is the loop that will iterate over the 
        housingLocationList array and render a 
        housing-location component for each item.

        The housingLocation is instatiate withe 
        each item in the array through the iterations,
        so, the housingLocation refers to the variable
        used int the *ngFor directive.
    -->
    <app-housing-location 
      *ngFor="let housingLocation of filteredLocationList"
      [housingLocation]="housingLocation"
    ></app-housing-location>
  </section>
